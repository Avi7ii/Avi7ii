<svg width="180" height="140" viewBox="0 0 180 140" xmlns="http://www.w3.org/2000/svg">
<style>
svg {
  font-family: -apple-system, BlinkMacSystemFont, Segoe UI, Helvetica, Arial, sans-serif, Apple Color Emoji, Segoe UI Emoji;
  font-size: 12px;
  line-height: 16px;
}

#background {
  width: calc(100% - 10px);
  height: calc(100% - 10px);
  fill: #00000000;
  stroke: #8B8B8B22;
  stroke-width: 1px;
  rx: 6px;
  ry: 6px;
}

foreignObject {
  width: calc(100% - 24px);
  height: calc(100% - 22px);
}

h2 {
  margin-top: 0;
  margin-bottom: 0.4em;
  line-height: 20px;
  font-size: 12px;
  font-weight: 600;
  color: rgb(72, 148, 224);
  fill: rgb(72, 148, 224);
}

ul {
  list-style: none;
  padding-left: 0;
  margin-top: 0;
  margin-bottom: 0;
}

li {
  display: inline-flex;
  font-size: 12px;
  margin-right: 1ch;
  align-items: center;
  flex-wrap: nowrap;
  transform: translateX(-500%);
  animation-duration: 1s;
  animation-name: slideIn;
  animation-function: ease-in-out;
  animation-fill-mode: forwards;
}

@keyframes slideIn {
  to {
    transform: translateX(0);
  }
}

div.ellipsis {
  height: 100%;
  overflow: hidden;
  text-overflow: ellipsis;
}

.octicon {
  fill: rgb(248, 96, 105);
  margin-right: 0.5ch;
  vertical-align: top;
}

.progress {
  display: flex;
  height: 8px;
  overflow: hidden;
  background-color: #00000000;
  border-radius: 6px;
  outline: 1px solid transparent;
  margin-bottom: 0.4em;
}

.lang {
  font-weight: 600;
  margin-right: 4px;
  color: rgb(135, 135, 135);
}

.percent {
  color: rgb(150,150,150)
}
</style>
<g>
<rect x="5" y="5" id="background" />
<g>
<foreignObject x="12" y="11" width="156" height="118">
<div xmlns="http://www.w3.org/1999/xhtml" class="ellipsis">

<h2>Languages</h2>

<div>
<span class="progress">
<span style="width:22.222%;background:#3572A5"></span><span style="width:22.222%;background:#f1e05a"></span><span style="width:11.111%;background:#A97BFF"></span><span style="width:11.111%;background:#b07219"></span><span style="width:11.111%;background:#F05138"></span><span style="width:11.111%;background:#e34c26"></span><span style="width:11.111%;background:#89e051"></span>
</span>
</div>

<ul>

<li style="animation-delay:0ms"><span style="color:#3572A5">●&#160;</span><span class="lang">Python</span><span class="percent">2</span></li><li style="animation-delay:80ms"><span style="color:#f1e05a">●&#160;</span><span class="lang">JS</span><span class="percent">2</span></li><li style="animation-delay:160ms"><span style="color:#A97BFF">●&#160;</span><span class="lang">Kotlin</span><span class="percent">1</span></li><li style="animation-delay:240ms"><span style="color:#b07219">●&#160;</span><span class="lang">Java</span><span class="percent">1</span></li><li style="animation-delay:320ms"><span style="color:#F05138">●&#160;</span><span class="lang">Swift</span><span class="percent">1</span></li><li style="animation-delay:400ms"><span style="color:#e34c26">●&#160;</span><span class="lang">HTML</span><span class="percent">1</span></li><li style="animation-delay:480ms"><span style="color:#89e051">●&#160;</span><span class="lang">Shell</span><span class="percent">1</span></li><li style="color:rgb(145,145,145);font-size:9px;transform:none;margin-top:3px;display:block">Public non-fork repos</li>

</ul>

</div>
</foreignObject>
</g>
</g>
</svg>
